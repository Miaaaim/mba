# ============================================================
# Nginx 配置模板 - mba.mia-portfolio.cn
# ============================================================
# 使用说明：
# 1. 将此文件内容复制到腾讯云服务器
# 2. 路径: /etc/nginx/sites-available/mba.mia-portfolio.cn
# 3. 修改 ssl_certificate 和 ssl_certificate_key 为实际证书路径
# 4. 运行以下命令启用配置：
#    ln -s /etc/nginx/sites-available/mba.mia-portfolio.cn /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
# ============================================================

# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name mba.mia-portfolio.cn;

    # Let's Encrypt 验证临时目录（首次申请证书时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/mba-site/current;
    }

    # 所有 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mba.mia-portfolio.cn;

    # ----- SSL 证书配置 -----
    # 使用 Certbot 自动申请的证书（推荐）
    ssl_certificate /etc/letsencrypt/live/mba.mia-portfolio.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mba.mia-portfolio.cn/privkey.pem;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----- 根目录 -----
    root /var/www/mba-site/current;
    index index.html;

    # ----- SPA 路由支持（React Router） -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- 静态资源缓存优化 -----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- 构建产物哈希文件名，永久缓存 -----
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- 安全头 -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----- 禁止访问隐藏文件 -----
    location ~ /\. {
        deny all;
    }

    # ----- Gzip 压缩 -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
