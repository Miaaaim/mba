name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mba-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 安装依赖
      - name: Install Dependencies
        run: npm ci --include=optional

      # 4. 构建项目
      - name: Build
        run: |
          echo "VITE_APP_URL=https://mba.mia-portfolio.cn" > .env.production
          npm run build:cloud

      # 5. 上传构建产物到服务器
      - name: Upload to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "dist/"
          target: "/var/www/mba-site/dist"
          strip_components: 0
          overwrite: true
          rm: true

      # 6. 在服务器上执行部署脚本
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 备份当前版本（用于回滚）
            cd /var/www/mba-site
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            if [ -d "current" ]; then
              mkdir -p "backups"
              cp -r current "backups/backup_${TIMESTAMP}"
              # 只保留最近 5 个备份
              ls -dt backups/backup_* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            fi

            # 原子切换：新构建 -> staging -> 替换 current
            rm -rf staging
            cp -r dist staging
            rm -rf current
            mv staging current

            # 设置权限
            chown -R www-data:www-data current
            chmod -R 755 current

            # 重载 Nginx（不中断现有连接）
            nginx -t && systemctl reload nginx
